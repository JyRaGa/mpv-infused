# libplacebo renderer: applies Dolby Vision (incl. Profile 5) reshaping and HDR tone mapping.
# Recent mpv already defaults to this on macOS; pinned here in case defaults change.
vo=gpu-next
gpu-api=vulkan
gpu-context=macvk
# Apple hardware decoding (mpv's default is software decoding, which is heavy for 4K HEVC)
hwdec=videotoolbox

# Don't flash the seek bar over the video when seeking (the volume bar etc. are unaffected)
osd-on-seek=no

# Allow boosting quiet files up to 250% volume (mpv's default cap is 130%)
volume-max=250

# Window: never open larger than 75% of the screen; last size/position is restored below
autofit-larger=75%x75%
include="~~/window-geometry.conf"

# Subtitles: pick English automatically, and load matching external subtitle files
slang=en,eng,English
sub-auto=fuzzy
